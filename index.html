
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h2>Employee Registration Form</h2>

        <form id="employeeForm">

            <label>First Name:</label>
            <input type="text" placeholder="Enter first name" required>

            <label>Last Name:</label>
            <input type="text" placeholder="Enter last name" required>

            <label>Date of Birth:</label>
            <input type="date" required>

            <label>Gender:</label>
            <select required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Email Address:</label>
            <input type="email" placeholder="Enter email" required>

            <label>Mobile Number:</label>
            <input type="tel" placeholder="Enter mobile number"
                   pattern="[0-9]{10}" maxlength="10" required>

            <label>Employee ID:</label>
            <input type="text" placeholder="Enter Employee ID" required>

            <label>Department:</label>
            <select required>
                <option value="">Select Department</option>
                <option>IT</option>
                <option>HR</option>
                <option>Finance</option>
                <option>Marketing</option>
            </select>

            <label>Qualification:</label>
            <input type="text" placeholder="Enter qualification" required>

            <label>Address:</label>
            <textarea placeholder="Enter your address" required></textarea>

            <button type="submit">Register</button>
            <button type="reset" class="reset">Clear</button>

        </form>

    </div>

</body>
</html>
